<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Warga - Smart City Tracker</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #1d4ed8;
        --primary-light: #3b82f6;
        --accent: #06b6d4;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --bg: #f1f5f9;
        --surface: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --nav-h: 64px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
      }

      /* ── Navbar ── */
      .t-navbar {
        height: auto;
        min-height: var(--nav-h);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 1px 12px rgba(0, 0, 0, 0.06);
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .t-navbar .navbar-collapse.show {
        padding-bottom: 12px;
      }

      .navbar-brand {
        font-family: "Sora", sans-serif;
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--text) !important;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
      }

      .brand-logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1rem;
        box-shadow: 0 2px 8px rgba(29, 78, 216, 0.3);
        flex-shrink: 0;
      }

      .brand-tag {
        font-size: 0.58rem;
        font-weight: 700;
        background: #eff6ff;
        color: var(--primary);
        border: 1px solid #bfdbfe;
        padding: 1px 7px;
        border-radius: 20px;
        letter-spacing: 0.1em;
      }

      .nav-link {
        color: var(--muted) !important;
        font-weight: 500;
        font-size: 0.875rem;
        border-radius: 8px;
        padding: 0.4rem 0.85rem !important;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }

      .nav-link:hover,
      .nav-link.active {
        color: var(--primary) !important;
        background: #eff6ff;
      }

      .nav-link.active {
        font-weight: 600;
      }

      /* User chip */
      .user-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 30px;
        padding: 0.28rem 0.75rem 0.28rem 0.35rem;
        font-size: 0.82rem;
        font-weight: 600;
        color: #334155;
      }

      .user-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: #fff;
        font-size: 0.7rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      /* ── Toast ── */
      .toast-wrap {
        position: fixed;
        top: calc(var(--nav-h) + 14px);
        right: 1.25rem;
        z-index: 1090;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        max-width: 360px;
        width: calc(100vw - 2.5rem);
      }

      .t-toast {
        display: flex;
        align-items: flex-start;
        gap: 0.7rem;
        padding: 0.85rem 1rem;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        border-left: 3px solid transparent;
        animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      .t-toast.success {
        border-color: var(--success);
      }
      .t-toast.danger {
        border-color: var(--danger);
      }
      .t-toast.warning {
        border-color: var(--warning);
      }
      .t-toast.info {
        border-color: var(--accent);
      }

      .t-toast__icon {
        font-size: 1rem;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .t-toast.success .t-toast__icon {
        color: var(--success);
      }
      .t-toast.danger .t-toast__icon {
        color: var(--danger);
      }
      .t-toast.warning .t-toast__icon {
        color: var(--warning);
      }
      .t-toast.info .t-toast__icon {
        color: var(--accent);
      }

      .t-toast__body {
        flex: 1;
        font-size: 0.85rem;
        color: #334155;
        line-height: 1.5;
      }
      .t-toast__close {
        background: none;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        font-size: 0.85rem;
        padding: 0;
        transition: color 0.2s;
      }
      .t-toast__close:hover {
        color: #475569;
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      .t-toast.hiding {
        animation: toastOut 0.2s ease forwards;
      }
      @keyframes toastOut {
        to {
          opacity: 0;
          transform: translateX(20px);
          max-height: 0;
          padding: 0;
          margin: 0;
          overflow: hidden;
        }
      }

      /* ── Page ── */
      .page-wrap {
        min-height: calc(100vh - var(--nav-h) - 54px);
        padding: 2rem 0 3.5rem;
      }

      /* ── Footer ── */
      .site-footer {
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 1rem 0;
        font-size: 0.76rem;
        color: var(--muted);
      }

      .online-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        display: inline-block;
        margin-right: 5px;
        box-shadow: 0 0 6px var(--success);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      .btn {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- ══════ NAVBAR ══════ -->
    <nav class="t-navbar navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="#">
          <div class="brand-logo"><i class="bi bi-building-check"></i></div>
          Smart City
          <span class="brand-tag ms-1">PORTAL</span>
        </a>

        <button
          class="navbar-toggler border-0 shadow-none"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMain"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMain">
          <!-- Nav links kiri -->
          <ul class="navbar-nav me-auto ms-3 mb-2 mb-lg-0 gap-1">
            <li class="nav-item">
              <a class="nav-link" href="#login">
                <i class="bi bi-house-door"></i>
                Beranda
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#dashboard">
                <i class="bi bi-speedometer2"></i>
                Dashboard
              </a>
            </li>
          </ul>

          <!-- Nav kanan: user chip + logout / tombol login -->
          <div class="d-flex align-items-center gap-2" id="nav-menus"></div>
        </div>
      </div>
    </nav>

    <!-- ══════ TOAST CONTAINER ══════ -->
    <div class="toast-wrap" id="toast-wrap"></div>

    <!-- ══════ CONTENT ══════ -->
    <div class="page-wrap">
      <div class="container">
        <main id="app-content"></main>
      </div>
    </div>

    <!-- ══════ FOOTER ══════ -->
    <footer class="site-footer">
      <div
        class="container d-flex flex-wrap justify-content-between align-items-center gap-2"
      >
        <span>
          <span class="online-dot"></span>
          Smart City Portal · Sistem Manajemen Kota Terpadu
        </span>
        <span>PIE 1416 · Teknologi Rekayasa Internet</span>
      </div>
    </footer>

    <!-- ══════ MODAL FORM LAPORAN ══════ -->
    <div
      class="modal fade"
      id="reportModal"
      tabindex="-1"
      aria-labelledby="reportModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <!-- Header -->
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title fw-bold" id="reportModalLabel">
              <i class="bi bi-pencil-square me-2"></i>
              Buat Laporan Baru
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <!-- Body -->
          <div class="modal-body p-4">
            <form id="reportForm">
              <!-- Judul -->
              <div class="mb-3">
                <label class="form-label fw-semibold small">
                  Judul Laporan
                </label>
                <input
                  type="text"
                  id="fieldTitle"
                  class="form-control"
                  placeholder="Contoh: Banjir di Jalan Merdeka"
                  required
                />
              </div>

              <!-- Kategori -->
              <div class="mb-3">
                <label class="form-label fw-semibold small">Kategori</label>
                <select id="fieldCategory" class="form-select" required>
                  <option value="">-- Pilih Kategori --</option>
                  <option value="Banjir">Banjir</option>
                  <option value="Jalan Rusak">Jalan Rusak</option>
                  <option value="Sampah">Sampah</option>
                  <option value="Lampu Mati">Lampu Mati</option>
                  <option value="Lainnya">Lainnya</option>
                </select>
              </div>

              <!-- Deskripsi -->
              <div class="mb-3">
                <label class="form-label fw-semibold small">Deskripsi</label>
                <textarea
                  id="fieldDescription"
                  class="form-control"
                  rows="3"
                  placeholder="Jelaskan masalah secara detail..."
                  required
                ></textarea>
              </div>

              <!-- Lokasi -->
              <div class="mb-3">
                <label class="form-label fw-semibold small">Lokasi</label>
                <input
                  type="text"
                  id="fieldLocation"
                  class="form-control"
                  placeholder="Contoh: Jl. Merdeka No. 1"
                  required
                />
              </div>
            </form>
          </div>

          <!-- Footer tombol -->
          <div class="modal-footer d-flex justify-content-between mt-4">
            <button
              type="button"
              class="btn btn-outline-secondary fw-bold px-4"
              id="btnDraft"
            >
              Simpan Draft
            </button>
            <button
              type="button"
              class="btn btn-primary fw-bold px-4"
              id="btnSubmit"
            >
              Ajukan
              <i class="bi bi-send-fill ms-1"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scripts SPA (urutan penting!) -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/router.js"></script>

    <script>
      // Toast helper - bisa dipanggil dari mana saja: showToast('Pesan', 'success')
      function showToast(message, type = "info") {
        const wrap = document.getElementById("toast-wrap");
        const iconMap = {
          success: "bi-check-circle-fill",
          danger: "bi-x-circle-fill",
          warning: "bi-exclamation-triangle-fill",
          info: "bi-info-circle-fill",
        };
        const el = document.createElement("div");
        el.className = `t-toast ${type}`;
        el.innerHTML = `
                <span class="t-toast__icon"><i class="bi ${iconMap[type] || iconMap.info}"></i></span>
                <span class="t-toast__body">${message}</span>
                <button class="t-toast__close" onclick="dismissToast(this.closest('.t-toast'))">
                    <i class="bi bi-x-lg"></i>
                </button>`;
        wrap.appendChild(el);
        setTimeout(() => dismissToast(el), 4500);
      }

      function dismissToast(el) {
        if (!el) return;
        el.classList.add("hiding");
        setTimeout(() => el.remove(), 250);
      }

      // Active nav highlight berdasarkan hash
      function updateActiveNav() {
        const hash = window.location.hash || "#login";
        document.querySelectorAll(".nav-link").forEach((link) => {
          link.classList.toggle("active", link.getAttribute("href") === hash);
        });
      }
      window.addEventListener("hashchange", updateActiveNav);
      window.addEventListener("DOMContentLoaded", updateActiveNav);
    </script>
  </body>
</html>
