<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="container mt-5">
    <div class="alert alert-danger shadow">
      <h2>Konfirmasi Hapus</h2>
      <p>Yakin mau hapus laporan: <strong>{{ object.title }}</strong>?</p>

      <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
          Ya, Hapus Permanen!
        </button>
        <a href="{% url 'list_reports' %}" class="btn btn-secondary">Batal</a>
      </form>
    </div>
  </body>
</html>
