<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Form Laporan - T-MAP</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="container mt-5">
    <div class="card shadow p-4">
      <h1 class="mb-4">
        {% if form.instance.pk %}Edit{% else %}Tambah{% endif %} Laporan
      </h1>

      <form method="POST">
        {% csrf_token %} {{ form.as_p }}
        <div class="mt-4">
          <button type="submit" class="btn btn-primary">Simpan Laporan</button>
          <a href="{% url 'list_reports' %}" class="btn btn-secondary">Batal</a>
        </div>
      </form>
    </div>
  </body>
</html>
