{% extends 'base.html' %} 
{% block title %}Registrasi Citizen | TheoTown{% endblock %} 
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow border-0">
      <div class="card-body p-5">
        <h3 class="text-center fw-bold mb-4">Daftar Akun Warga</h3>
        <form method="post">
          {% csrf_token %} {{ form.as_p }}
          <button type="submit" class="btn btn-success w-100 py-2 mt-3">
            Daftar Sekarang
          </button>
        </form>
        <p class="text-center mt-3">
          Sudah punya akun? <a href="{% url 'login' %}">Login di sini</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
